services:
  script:
    image: udocker
    pull_policy: never
    environment:
      SSH_USER: operator
      SSH_AUTHORIZED_KEYS_FILE: /run/secrets/authorized_keys
    volumes:
      - /mnt/Aodnas/Docker/utils-docker/jobs:/workspace/jobs
      - /mnt/Aodnas/Docker/utils-docker/videos:/workspace/videos
      - /mnt/Aodnas/Docker/utils-docker/build/authorized_keys:/run/secrets/authorized_keys:ro
    networks:
      - ix-internal-n8n-n8n-net
    restart: unless-stopped

networks:
  ix-internal-n8n-n8n-net:
    external: true
